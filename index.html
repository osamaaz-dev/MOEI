<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قوالب وزارة الصناعة والتجارة الداخلية</title>
<link rel="icon" type="image/png" href="templates/icon.png?v=3">
<link rel="stylesheet" href="app.css?v=3">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <img class="topbar-logo" src="templates/logo-h-white.png?v=3" alt="وزارة الصناعة والتجارة الداخلية">
    <span class="topbar-divider" aria-hidden="true"></span>
    <div class="topbar-title">
      <h1>قوالب وزارة الصناعة والتجارة الداخلية</h1>
      <p>ارفع الصور، اضبط الكادر، ثم نزّلها جاهزة بالقالب الرسمي</p>
    </div>
  </div>
</header>

<div id="loadError" class="load-error" hidden></div>

<main class="page">

  <section class="step" id="stepPhotos">
    <div class="step-head">
      <h2>الصور</h2>
      <span class="step-note" id="photoCount"></span>
    </div>

    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <svg class="dz-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <strong>اسحب الصور إلى هنا أو اضغط للاختيار</strong>
      <span>أي قياس — القالب (أفقي، 16:9، ستوري) يُختار تلقائيًا حسب الصورة (حتى 10 صور)</span>
    </label>

    <div class="toolbar" id="photosToolbar" hidden>
      <div class="toolbar-group">
        <span class="toolbar-label">القالب:</span>
        <div class="seg seg-wrap" id="globalFormat" role="group" aria-label="القالب لكل الصور"></div>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-hint">اسحب الصورة لتحريك الكادر، واسحب ⠿ لتغيير الترتيب</span>
        <button type="button" class="btn btn-ghost" id="btnClearAll">حذف كل الصور</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </section>

</main>

<!-- التنزيل -->
<div class="actionbar" id="actionbar" aria-live="polite">
  <div class="actionbar-inner">
    <div class="ab-info">
      <strong id="abSummary"></strong>
      <span id="abStatus" class="ab-status"></span>
      <div class="ab-progress"><span id="abProgress"></span></div>
    </div>
    <div class="ab-buttons">
      <button type="button" class="btn btn-gold" id="btnDownload">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0 4.5-4.5M12 15l-4.5-4.5M4 17v1a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        تنزيل الصور
      </button>
    </div>
  </div>
</div>

<!-- معاينة كبيرة -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="معاينة كبيرة" hidden>
  <div class="lb-top">
    <div class="lb-title">
      <strong id="lbTitle"></strong>
      <span id="lbMeta"></span>
    </div>
    <div class="seg lb-formats" id="lbFormats" role="group" aria-label="القالب"></div>
    <button type="button" class="lb-close" id="lbClose" title="إغلاق (Esc)" aria-label="إغلاق">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="lb-stage" id="lbStage">
    <button type="button" class="lb-nav lb-prev" id="lbPrev" title="السابقة" aria-label="الصورة السابقة"></button>
    <canvas id="lbCanvas" aria-label="معاينة كبيرة — اسحب لتحريك الكادر"></canvas>
    <button type="button" class="lb-nav lb-next" id="lbNext" title="التالية" aria-label="الصورة التالية"></button>
  </div>
  <div class="lb-bottom">
    <div class="zoom lb-zoom">
      <span aria-hidden="true">−</span>
      <input type="range" id="lbZoom" min="0.5" max="3" step="0.01" value="1" aria-label="تكبير">
      <span aria-hidden="true">+</span>
    </div>
    <button type="button" class="btn btn-ghost-dark" id="lbReset">إعادة الكادر</button>
    <button type="button" class="btn btn-gold" id="lbDownload">تنزيل هذه الصورة</button>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js?v=3"></script>
</body>
</html>
